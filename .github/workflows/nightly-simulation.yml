name: Nightly simulation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-simulation
  cancel-in-progress: false

jobs:
  determinism-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Determinism
        run: cargo test -p rustagotchi-tests --test deterministic_simulation
      - name: Offline/live equivalence
        run: cargo test -p rustagotchi-tests --test offline_equivalence
      - name: Seven-day lifecycle
        run: cargo test -p rustagotchi-tests --test seven_day_simulation
      - name: One-year lifecycle
        run: cargo test -p rustagotchi-tests --test one_year_simulation --release
      - name: Simulation benchmark
        run: cargo bench -p rustagotchi-simulation --bench simulation

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run resolve_battle -- -max_total_time=300
      - run: cargo +nightly fuzz run generate_offspring -- -max_total_time=300
      - run: cargo +nightly fuzz run load_save -- -max_total_time=300
      - run: cargo +nightly fuzz run parse_content -- -max_total_time=300
